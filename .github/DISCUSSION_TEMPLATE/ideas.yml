title: '[Idea]: '
body:
  - type: markdown
    attributes:
      value: |
        Ideas is the place for early-stage proposals. Once an idea has a clear scope and
        maintainer interest, it can be converted into a
        [feature request](https://github.com/Automated-Cross-Contract-SDK/Automated-Cross-Contract-SDK-Frontend-/issues/new?template=feature_request.yml).
        See the [roadmap](https://github.com/Automated-Cross-Contract-SDK/Automated-Cross-Contract-SDK-Frontend-/blob/main/docs/roadmap.md)
        to check whether it is already planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed idea
      description: Describe the idea. An API sketch is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
