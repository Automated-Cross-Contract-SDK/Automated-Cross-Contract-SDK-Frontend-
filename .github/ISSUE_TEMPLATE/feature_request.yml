name: ✨ Feature request
description: Suggest a new feature or improvement for the SDK
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please search
        [existing issues](https://github.com/Automated-Cross-Contract-SDK/Automated-Cross-Contract-SDK-Frontend-/issues)
        first, and read the
        [contributing guide](https://github.com/Automated-Cross-Contract-SDK/Automated-Cross-Contract-SDK-Frontend-/blob/main/CONTRIBUTING.md)
        for guidance on requesting features.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Describe the problem you are trying to solve, not just the solution.
      placeholder: "I'm trying to ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Who benefits from this, and how often would it be used?
  - type: textarea
    id: api-design
    attributes:
      label: Proposed API design
      description: If you have a proposed API design, include a code example.
      render: typescript
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What alternatives did you consider, and why weren't they enough?
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I have read the contributing guide.
          required: true
        - label: For large or potentially breaking features, I will open a discussion issue first.
