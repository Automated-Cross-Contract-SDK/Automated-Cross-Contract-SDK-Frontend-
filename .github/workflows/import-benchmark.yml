name: Import Benchmark

on:
  pull_request:
    branches: [main]

jobs:
  import-time:
    name: Cold import time
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build packages (benchmark imports published entries)
        run: npm run build

      - name: Measure cold import time per package entry
        run: npm run benchmark:imports -- --summary "$GITHUB_STEP_SUMMARY" --json import-benchmark.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-benchmark
          path: import-benchmark.json
          if-no-files-found: ignore
