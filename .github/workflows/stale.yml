name: Stale Issues and PRs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has had no activity for 60 days and is marked stale. Comment with a brief status update to keep it open; otherwise it will close in 14 days.'
          stale-pr-message: 'This pull request has had no activity for 30 days and is marked stale. Comment with a brief status update to keep it open; otherwise it will close in 14 days.'
          close-issue-message: 'This issue was closed after 14 days in the stale state. Please reopen it if it is still relevant.'
          close-pr-message: 'This pull request was closed after 14 days in the stale state. Please reopen it if you would like to continue.'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          days-before-issue-close: 14
          days-before-pr-close: 14
          exempt-issue-labels: 'help wanted,good first issue'
          exempt-pr-labels: 'dependencies'