name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  validate-changelogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changelogs for every publishable package
        run: |
          set -euo pipefail

          # Collect every publishable package directory from the release-please manifest.
          if [ ! -f .release-please-manifest.json ]; then
            echo "::error::Missing .release-please-manifest.json"
            exit 1
          fi

          packages=$(node -e '
            const manifest = require("./.release-please-manifest.json");
            const dirs = Object.keys(manifest).filter((p) => p !== ".");
            process.stdout.write(dirs.join("\n"));
          ')

          if [ -z "$packages" ]; then
            echo "No publishable packages found in manifest; nothing to validate."
            exit 0
          fi

          failed=0
          while IFS= read -r pkg; do
            [ -z "$pkg" ] && continue
            changelog="$pkg/CHANGELOG.md"
            if [ ! -f "$changelog" ]; then
              echo "::error file=$changelog::Missing changelog for publishable package '$pkg'"
              failed=1
              continue
            fi

            # Require release notes that identify user-facing changes, migration
            # needs, and affected package names before a release can proceed.
            if ! grep -qiE '^#+ .*(user-facing|user facing|breaking|migration|migrate)' "$changelog"; then
              echo "::error file=$changelog::Changelog for '$pkg' must identify user-facing changes and migration needs"
              failed=1
            fi

            if ! grep -qF "$pkg" "$changelog"; then
              echo "::error file=$changelog::Changelog for '$pkg' must reference the affected package name '$pkg'"
              failed=1
            fi
          done <<< "$packages"

          if [ "$failed" -ne 0 ]; then
            echo "::error::Changelog validation failed; blocking release."
            exit 1
          fi

          echo "All publishable packages have valid changelogs."
