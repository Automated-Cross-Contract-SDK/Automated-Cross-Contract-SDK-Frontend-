name: Bundle Size

on:
  pull_request:
    branches: [main]

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Per-entry-point gzip budgets + tree-shaking fixture. Fails naming the
      # offending entry point. See CONTRIBUTING.md "Bundle budgets".
      - run: node scripts/check-bundle-budgets.mjs --summary "$GITHUB_STEP_SUMMARY"
