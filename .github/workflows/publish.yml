
name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Verify internal dependencies are pinned to workspace versions
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const pkgGlobs = ['packages/sdk', 'packages/react-hook', 'packages/vue-hook', 'packages/svelte-hook'];
          const internalNames = new Set();
          const pkgs = {};
          for (const dir of pkgGlobs) {
            const p = path.join(root, dir, 'package.json');
            if (!fs.existsSync(p)) continue;
            const json = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkgs[dir] = json;
            internalNames.add(json.name);
          }
          const failures = [];
          for (const [dir, json] of Object.entries(pkgs)) {
            for (const field of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
              const deps = json[field] || {};
              for (const [name, range] of Object.entries(deps)) {
                if (!internalNames.has(name)) continue;
                if (range !== pkgs[Object.keys(pkgs).find((d) => pkgs[d].name === name)]?.version) {
                  failures.push(`${dir} ${field} ${name} -> ${range} (expected exact workspace version)`);
                }
              }
            }
          }
          if (failures.length) {
            console.error('Internal dependencies must be pinned to exact workspace versions:');
            for (const f of failures) console.error('  - ' + f);
            process.exit(1);
          }
          console.log('All internal dependencies are pinned to exact workspace versions.');
          EOF

      - name: Verify no sibling resolves from the registry
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const pkgGlobs = ['packages/sdk', 'packages/react-hook', 'packages/vue-hook', 'packages/svelte-hook'];
          const internalNames = new Set();
          for (const dir of pkgGlobs) {
            const p = path.join(root, dir, 'package.json');
            if (!fs.existsSync(p)) continue;
            internalNames.add(JSON.parse(fs.readFileSync(p, 'utf8')).name);
          }
          const lockPath = path.join(root, 'package-lock.json');
          if (!fs.existsSync(lockPath)) {
            console.error('package-lock.json is required to verify workspace resolution.');
            process.exit(1);
          }
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          const packages = lock.packages || {};
          const offenders = [];
          for (const [loc, meta] of Object.entries(packages)) {
            if (!loc.startsWith('node_modules/')) continue;
            const name = loc.slice('node_modules/'.length);
            if (!internalNames.has(name)) continue;
            if (meta.resolved && /^https?:\/\/registry\.npmjs\.org\//.test(meta.resolved)) {
              offenders.push(`${loc} resolved from registry: ${meta.resolved}`);
            }
          }
          if (offenders.length) {
            console.error('Internal packages must resolve from the workspace, not the registry:');
            for (const o of offenders) console.error('  - ' + o);
            process.exit(1);
          }
          console.log('No internal package resolves a sibling from the registry.');
          EOF

      - name: Validate supported-version metadata against the package matrix
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const pkgDirs = ['packages/sdk', 'packages/react-hook', 'packages/vue-hook', 'packages/svelte-hook'];

          // The package matrix is the single source of truth for supported
          // runtime and peer dependency ranges. Every publishable package must
          // declare `engines.node` and any internal peer dependency ranges that
          // match the matrix exactly, so consumers get consistent metadata.
          const matrixPath = path.join(root, 'packages', 'package-matrix.json');
          if (!fs.existsSync(matrixPath)) {
            console.error('packages/package-matrix.json is required to validate supported-version metadata.');
            process.exit(1);
          }
          const matrix = JSON.parse(fs.readFileSync(matrixPath, 'utf8'));
          const expectedNode = matrix?.engines?.node;
          if (!expectedNode) {
            console.error('package-matrix.json must declare engines.node.');
            process.exit(1);
          }
          const expectedPeers = matrix?.peerDependencies || {};

          const failures = [];
          const publishable = [];
          for (const dir of pkgDirs) {
            const pkgPath = path.join(root, dir, 'package.json');
            if (!fs.existsSync(pkgPath)) continue;
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            if (pkg.private === true) continue;
            publishable.push({ dir, pkg });
          }

          if (!publishable.length) {
            console.error('No publishable packages found; refusing to release.');
            process.exit(1);
          }

          const internalNames = new Set(publishable.map((p) => p.pkg.name));

          for (const { dir, pkg } of publishable) {
            const nodeRange = pkg.engines && pkg.engines.node;
            if (!nodeRange) {
              failures.push(`${pkg.name}: missing engines.node`);
            } else if (nodeRange !== expectedNode) {
              failures.push(`${pkg.name}: engines.node "${nodeRange}" does not match matrix "${expectedNode}"`);
            }

            const peers = pkg.peerDependencies || {};
            for (const [name, range] of Object.entries(peers)) {
              if (!internalNames.has(name)) continue;
              const expected = expectedPeers[name];
              if (!expected) {
                failures.push(`${pkg.name}: peer dependency ${name} is not declared in the package matrix`);
              } else if (range !== expected) {
                failures.push(`${pkg.name}: peer dependency ${name} "${range}" does not match matrix "${expected}"`);
              }
            }
          }

          if (failures.length) {
            console.error('Supported-version metadata validation failed:');
            for (const f of failures) console.error('  - ' + f);
            console.error('Declare engines.node and internal peerDependencies consistently with packages/package-matrix.json.');
            process.exit(1);
          }

          console.log('Supported-version metadata matches the package matrix for all publishable packages.');
          EOF

      - name: Validate changelog for every publishable package
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const pkgDirs = ['packages/sdk', 'packages/react-hook', 'packages/vue-hook', 'packages/svelte-hook'];

          // A changelog entry must identify user-facing changes, migration needs,
          // and the affected package names before a release can proceed.
          const REQUIRED_SECTIONS = [
            { key: 'user-facing changes', pattern: /^#{1,6}\s*user-facing changes\s*$/im },
            { key: 'migration', pattern: /^#{1,6}\s*migration(?: notes?)?\s*$/im },
            { key: 'affected packages', pattern: /^#{1,6}\s*affected packages?\s*$/im },
          ];

          const failures = [];
          const publishable = [];

          for (const dir of pkgDirs) {
            const pkgPath = path.join(root, dir, 'package.json');
            if (!fs.existsSync(pkgPath)) continue;
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            if (pkg.private === true) continue;
            publishable.push({ dir, name: pkg.name });
          }

          if (!publishable.length) {
            console.error('No publishable packages found; refusing to release.');
            process.exit(1);
          }

          const publishableNames = new Set(publishable.map((p) => p.name));

          for (const { dir, name } of publishable) {
            const candidates = ['CHANGELOG.md', 'changelog.md'].map((f) => path.join(root, dir, f));
            const changelogPath = candidates.find((p) => fs.existsSync(p));
            if (!changelogPath) {
              failures.push(`${name}: missing CHANGELOG.md in ${dir}`);
              continue;
            }
            const content = fs.readFileSync(changelogPath, 'utf8');
            if (!content.trim()) {
              failures.push(`${name}: CHANGELOG.md is empty`);
              continue;
            }

            for (const section of REQUIRED_SECTIONS) {
              if (!section.pattern.test(content)) {
                failures.push(`${name}: CHANGELOG.md is missing a "${section.key}" section`);
              }
            }

            // The affected packages section must name at least one publishable package.
            const affectedMatch = content.match(/^#{1,6}\s*affected packages?\s*$([\s\S]*?)(?=^#{1,6}\s|\s*$)/im);
            if (affectedMatch) {
              const body = affectedMatch[1] || '';
              const named = [...publishableNames].some((pkgName) => body.includes(pkgName));
              if (!named) {
                failures.push(`${name}: "affected packages" must name at least one publishable package`);
              }
            }
          }

          if (failures.length) {
            console.error('Changelog validation failed for publishable packages:');
            for (const f of failures) console.error('  - ' + f);
            console.error('Each publishable package needs a CHANGELOG.md with "User-facing changes", "Migration", and "Affected packages" sections.');
            process.exit(1);
          }

          console.log('Changelog validation passed for all publishable packages.');
          EOF

      - run: npm run build:sdk
      - run: npm run build:hook

      - name: Publish all packages atomically with provenance
        run: |
          set -euo pipefail
          packages=(packages/sdk packages/react-hook packages/vue-hook packages/svelte-hook)
          published=()
          failed=""
          for pkg in "${packages[@]}"; do
            echo "::group::Publishing $pkg"
            if npm publish -w "$pkg" --provenance --access public; then
              published+=("$pkg")
              echo "::endgroup::"
            else
              failed="$pkg"
              echo "::endgroup::"
              break
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Partial publish detected. Failed at $failed."
            echo "::error::Already published: ${published[*]:-none}"
            exit 1
          fi
          echo "Published: ${published[*]}"
