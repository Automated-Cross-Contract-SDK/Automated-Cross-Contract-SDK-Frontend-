
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel to publish"
        required: true
        default: canary
        type: choice
        options:
          - canary
      base:
        description: "Base version to derive the canary prerelease from (e.g. 1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Verify internal dependencies are pinned to workspace versions
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const pkgGlobs = ['packages/sdk', 'packages/react-hook', 'packages/vue-hook', 'packages/svelte-hook'];
          const internalNames = new Set();
          const pkgs = {};
          for (const dir of pkgGlobs) {
            const p = path.join(root, dir, 'package.json');
            if (!fs.existsSync(p)) continue;
            const json = JSON.parse(fs.readFileSync(p, 'utf8'));
            pkgs[dir] = json;
            internalNames.add(json.name);
          }
          const failures = [];
          for (const [dir, json] of Object.entries(pkgs)) {
            for (const field of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
              const deps = json[field] || {};
              for (const [name, range] of Object.entries(deps)) {
                if (!internalNames.has(name)) continue;
                if (range !== pkgs[Object.keys(pkgs).find((d) => pkgs[d].name === name)]?.version) {
                  failures.push(`${dir} ${field} ${name} -> ${range} (expected exact workspace version)`);
                }
              }
            }
          }
          if (failures.length) {
            console.error('Internal dependencies must be pinned to exact workspace versions:');
            for (const f of failures) console.error('  - ' + f);
            process.exit(1);
          }
          console.log('All internal dependencies are pinned to exact workspace versions.');
          EOF

      - name: Verify no sibling resolves from the registry
        run: |
          set -euo pipefail
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const pkgGlobs = ['packages/sdk', 'packages/react-hook', 'packages/vue-hook', 'packages/svelte-hook'];
          const internalNames = new Set();
          for (const dir of pkgGlobs) {
            const p = path.join(root, dir, 'package.json');
            if (!fs.existsSync(p)) continue;
            internalNames.add(JSON.parse(fs.readFileSync(p, 'utf8')).name);
          }
          const lockPath = path.join(root, 'package-lock.json');
          if (!fs.existsSync(lockPath)) {
            console.error('package-lock.json is required to verify workspace resolution.');
            process.exit(1);
          }
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          const packages = lock.packages || {};
          const offenders = [];
          for (const [loc, meta] of Object.entries(packages)) {
            if (!loc.startsWith('node_modules/')) continue;
            const name = loc.slice('node_modules/'.length);
            if (!internalNames.has(name)) continue;
            if (meta.resolved && /^https?:\/\/registry\.npmjs\.org\//.test(meta.resolved)) {
              offenders.push(`${loc} resolved from registry: ${meta.resolved}`);
            }
          }
          if (offenders.length) {
            console.error('Internal packages must resolve from the workspace, not the registry:');
            for (const o of offenders) console.error('  - ' + o);
            process.exit(1);
          }
          console.log('No internal package resolves a sibling from the registry.');
          EOF

      - name: Resolve release channel
        id: channel
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            channel="${{ inputs.channel }}"
            base="${{ inputs.base }}"
          else
            channel="stable"
            base=""
          fi
          if [ "$channel" = "canary" ]; then
            if ! printf '%s' "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Canary base must be a stable semver like 1.2.3 (got '$base')."
              exit 1
            fi
            # Canary versions are <base>-canary.<run>.<attempt> so they sort below
            # the stable release and never collide across runs.
            version="${base}-canary.${{ github.run_number }}.${{ github.run_attempt }}"
            tag="canary"
          else
            version=""
            tag="latest"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved channel=$channel version=${version:-<from package.json>} tag=$tag"

      - name: Apply canary version
        if: steps.channel.outputs.channel == 'canary'
        run: |
          set -euo pipefail
          version="${{ steps.channel.outputs.version }}"
          packages=(packages/sdk packages/react-hook packages/vue-hook packages/svelte-hook)
          for pkg in "${packages[@]}"; do
            npm version "$version" -w "$pkg" --no-git-tag-version --allow-same-version
          done
          echo "Applied canary version $version to all packages."

      - run: npm run build:sdk
      - run: npm run build:hook

      - name: Publish all packages atomically with provenance
        run: |
          set -euo pipefail
          tag="${{ steps.channel.outputs.tag }}"
          packages=(packages/sdk packages/react-hook packages/vue-hook packages/svelte-hook)
          published=()
          failed=""
          for pkg in "${packages[@]}"; do
            echo "::group::Publishing $pkg (dist-tag: $tag)"
            if npm publish -w "$pkg" --provenance --access public --tag "$tag"; then
              published+=("$pkg")
              echo "::endgroup::"
            else
              failed="$pkg"
              echo "::endgroup::"
              break
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Partial publish detected. Failed at $failed."
            echo "::error::Already published: ${published[*]:-none}"
            exit 1
          fi
          echo "All packages published successfully with provenance attestations."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify provenance attestations
        run: |
          set -euo pipefail
          packages=(packages/sdk packages/react-hook packages/vue-hook packages/svelte-hook)
          failures=()
          for pkg in "${packages[@]}"; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            echo "::group::Verifying provenance for $name@$version"
            meta=$(npm view "$name@$version" --json 2>/dev/null || true)
            if [ -z "$meta" ]; then
              echo "::error::No registry metadata found for $name@$version"
              failures+=("$name@$version: missing registry metadata")
              echo "::endgroup::"
              continue
            fi
            result=$(printf '%s' "$meta" | node -e '
              let raw = "";
              process.stdin.on("data", (c) => (raw += c));
              process.stdin.on("end", () => {
                const name = process.argv[1];
                const version = process.argv[2];
                let meta;
                try {
                  meta = JSON.parse(raw);
                } catch (err) {
                  console.log("FAIL: unable to parse registry metadata: " + err.message);
                  process.exit(0);
                }
                const dist = meta.dist || {};
                const problems = [];
                if (!dist.attestations || !dist.attestations.url) {
                  problems.push("missing dist.attestations.url (no provenance attestation)");
                }
                if (!dist.signatures || !Array.isArray(dist.signatures) || dist.signatures.length === 0) {
                  problems.push("missing dist.signatures (no registry signature)");
                } else {
                  for (const sig of dist.signatures) {
                    if (!sig || !sig.keyid || !sig.sig) {
                      problems.push("malformed registry signature entry");
                      break;
                    }
                  }
                }
                if (problems.length) {
                  console.log("FAIL: " + problems.join("; "));
                } else {
                  console.log("OK: provenance attestation and registry signature present");
                }
              });
            ' "$name" "$version")
            echo "$result"
            if [[ "$result" != OK:* ]]; then
              failures+=("$name@$version: $result")
            fi
            echo "::endgroup::"
          done
          if [ "${#failures[@]}" -gt 0 ]; then
            echo "::error::Provenance verification failed for ${#failures[@]} package(s)."
            echo "## Provenance verification failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            for f in "${failures[@]}"; do
              echo "- $f" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Recovery: see \`docs/RELEASE.md#recovering-from-a-partial-publish\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All packages verified: provenance attestations and registry signatures present."
