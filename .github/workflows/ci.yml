name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format

      - run: npm test

      - run: npm run test -w packages/sdk -- --coverage
      - run: npm run test -w packages/react-hook -- --coverage

      - uses: codecov/codecov-action@v4
        with:
          files: packages/sdk/coverage/lcov.info,packages/react-hook/coverage/lcov.info
          fail_ci_if_error: false

      - run: npm run build
