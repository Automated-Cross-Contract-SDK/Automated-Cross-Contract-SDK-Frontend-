name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck (all packages via Turbo)
        run: npm run typecheck

      - name: Lint (all packages via Turbo)
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Test (all packages via Turbo)
        run: npm test

      - name: SSR-safety import tests (react/vue/svelte hooks)
        run: |
          npm run test -w packages/react-hook -- src/__tests__/ssr.test.ts
          npm run test -w packages/vue-hook -- src/__tests__/ssr.test.ts
          npm run test -w packages/svelte-hook -- src/__tests__/ssr.test.ts

      - name: Test with coverage (sdk)
        run: npm run test -w packages/sdk -- --coverage

      - name: Test with coverage (react-hook)
        run: npm run test -w packages/react-hook -- --coverage

      - uses: codecov/codecov-action@v4
        with:
          files: packages/sdk/coverage/lcov.info,packages/react-hook/coverage/lcov.info
          fail_ci_if_error: false

      - name: Build (all packages via Turbo)
        run: npm run build
