name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck (all packages via Turbo)
        run: npm run typecheck

      - name: Lint (all packages via Turbo)
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Verify every package defines a test script
        run: |
          missing=0
          for pkg in packages/*/package.json; do
            if ! node -e "process.exit(require('./${pkg}').scripts?.test ? 0 : 1)"; then
              echo "::error file=${pkg}::package has no \"test\" script — it will be silently skipped by 'npm test' (Turbo)"
              missing=1
            fi
          done
          exit $missing

      - name: Test with coverage (all packages)
        run: |
          for pkg in adapter-albedo adapter-freighter adapter-lobstr adapter-xbull react-hook sdk svelte-hook vue-hook; do
            echo "::group::packages/$pkg"
            npm run test -w "packages/$pkg" -- --coverage
            echo "::endgroup::"
          done

      - uses: codecov/codecov-action@v4
        with:
          files: packages/adapter-albedo/coverage/lcov.info,packages/adapter-freighter/coverage/lcov.info,packages/adapter-lobstr/coverage/lcov.info,packages/adapter-xbull/coverage/lcov.info,packages/react-hook/coverage/lcov.info,packages/sdk/coverage/lcov.info,packages/svelte-hook/coverage/lcov.info,packages/vue-hook/coverage/lcov.info
          fail_ci_if_error: false

      - name: Build (all packages via Turbo)
        run: npm run build
