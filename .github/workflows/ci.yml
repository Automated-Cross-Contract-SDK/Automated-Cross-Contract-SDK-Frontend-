name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Audit production dependencies (fail on unallowlisted high/critical)
        run: node scripts/check-audit.mjs

  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck (all packages via Turbo)
        run: npm run typecheck

      - name: Type tests — public API surface (all packages via Turbo)
        run: npm run test:types

      - name: Lint (all packages via Turbo)
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Verify every package defines a test script
        run: |
          missing=0
          for pkg in packages/*/package.json; do
            if ! node -e "process.exit(require('./${pkg}').scripts?.test ? 0 : 1)"; then
              echo "::error file=${pkg}::package has no \"test\" script — it will be silently skipped by 'npm test' (Turbo)"
              missing=1
            fi
          done
          exit $missing

      - name: Test with coverage (all packages)
        run: |
          for pkg in adapter-albedo adapter-freighter adapter-lobstr adapter-xbull react-hook sdk svelte-hook vue-hook; do
            echo "::group::packages/$pkg"
            npm run test -w "packages/$pkg" -- --coverage
            echo "::endgroup::"
          done

      - name: Test with coverage (vue-hook)
        run: npm run test -w packages/vue-hook -- --coverage

      - name: Test with coverage (svelte-hook)
        run: npm run test -w packages/svelte-hook -- --coverage

      - name: Test with coverage (wallet adapters)
        run: |
          npm run test -w packages/adapter-xbull -- --coverage
          npm run test -w packages/adapter-freighter -- --coverage
          npm run test -w packages/adapter-albedo -- --coverage
          npm run test -w packages/adapter-lobstr -- --coverage

      - name: Test with coverage (vue-hook)
        run: npm run test -w packages/vue-hook -- --coverage

      - name: Test with coverage (svelte-hook)
        run: npm run test -w packages/svelte-hook -- --coverage

      - name: Test with coverage (wallet adapters)
        run: |
          for pkg in adapter-albedo adapter-freighter adapter-lobstr adapter-xbull; do
            npm run test -w packages/$pkg -- --coverage
          done

      - uses: codecov/codecov-action@v4
        with:
          files: packages/sdk/coverage/lcov.info,packages/react-hook/coverage/lcov.info
          fail_ci_if_error: true

      - name: Build (all packages via Turbo)
        run: npm run build
      - name: Build (all packages via Turbo)
        run: npm run build

  cross-platform:
    name: ${{ matrix.package }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        package:
          - react-hook
          - vue-hook
          - svelte-hook
          - adapter-albedo
          - adapter-freighter
          - adapter-lobstr
          - adapter-rabet
          - adapter-walletconnect
          - adapter-walletkit
          - adapter-xbull
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build workspace dependencies
        run: npx turbo run build --filter=@soroban-resurrect/${{ matrix.package }}^...

      - name: Typecheck
        run: npm run typecheck -w packages/${{ matrix.package }} --if-present

      - name: Test
        run: npm run test -w packages/${{ matrix.package }}

  wallet-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FREIGHTER_E2E: ${{ secrets.FREIGHTER_E2E }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx --yes playwright@1.55.0 install --with-deps chromium
      - run: npx --yes playwright@1.55.0 test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wallet-e2e-report
          path: |
            playwright-report
            test-results
